<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Damage Calculator</title>
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar-inner">
        <div class="app-title">
          <h1>Damage Calculator</h1>
          <p class="subtitle">Monte Carlo simulation of the attack sequence: hit, wound, save, damage.</p>
        </div>
        <button type="button" id="open-config" class="icon-button app-bar-menu" aria-label="Open configuration" title="Configuration" aria-haspopup="dialog">☰</button>
      </div>
    </header>

    <main>
      <form id="calculator" class="calculator" novalidate>
        <section class="panel attacker" aria-labelledby="attacker-title">
          <div class="panel-head">
            <h2 id="attacker-title">Attacker</h2>
            <p class="panel-hint">Weapons resolve top to bottom. A wounded model carries over to the next weapon.</p>
          </div>
          <div class="preset-bar">
            <div class="field preset-field">
              <label for="attack-select">Attack</label>
              <select id="attack-select" class="preset-select"></select>
            </div>
            <button type="button" id="edit-attack" class="button secondary small">✎ Edit attack</button>
          </div>
          <div id="attack-conditions"></div>
          <div id="attack-roster"></div>
          <p id="optimise-hint" class="optimise-hint" hidden></p>
        </section>

        <section class="panel defender" aria-labelledby="defender-title">
          <div class="panel-head">
            <h2 id="defender-title">Defender</h2>
            <p class="panel-hint">Damage beyond a model's remaining wounds is lost.</p>
          </div>
          <div id="defender-presets"></div>
          <div id="defender"></div>
        </section>

        <div class="run-bar">
          <button type="submit" id="simulate" class="button primary">Simulate</button>
          <p id="run-status" class="run-status" aria-live="polite"></p>
        </div>
      </form>

      <section id="results" class="results" aria-label="Results">
        <p class="empty">Pick an attack and a defender, then press Simulate.</p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
