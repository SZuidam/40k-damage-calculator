<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Damage Calculator</title>
  </head>
  <body>
    <header class="app-header">
      <h1>Damage Calculator</h1>
      <p class="subtitle">Monte Carlo simulation of the attack sequence: hit, wound, save, damage.</p>
    </header>

    <main>
      <form id="calculator" class="calculator" novalidate>
        <section class="panel attacker" aria-labelledby="attacker-title">
          <div class="panel-head">
            <h2 id="attacker-title">Attacker</h2>
            <p class="panel-hint">Weapons resolve top to bottom. A wounded model carries over to the next weapon.</p>
          </div>
          <div id="weapons"></div>
          <div class="panel-actions">
            <button type="button" id="add-weapon" class="button secondary">+ Add weapon</button>
            <div class="optimise">
              <button type="button" id="optimise" class="button secondary" aria-describedby="optimise-status">
                Optimise order <span class="badge" id="optimise-badge" hidden></span>
              </button>
              <p id="optimise-status" class="optimise-status" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <section class="panel defender" aria-labelledby="defender-title">
          <div class="panel-head">
            <h2 id="defender-title">Defender</h2>
            <p class="panel-hint">Damage beyond a model's remaining wounds is lost.</p>
          </div>
          <div id="defender"></div>
        </section>

        <div class="run-bar">
          <div class="field">
            <label for="iterations">Iterations</label>
            <input id="iterations" type="number" inputmode="numeric" min="100" max="1000000" step="1000" />
          </div>
          <button type="submit" id="simulate" class="button primary">Simulate</button>
          <p id="run-status" class="run-status" aria-live="polite"></p>
        </div>
      </form>

      <section id="results" class="results" aria-label="Results">
        <p class="empty">Enter a loadout and press Simulate.</p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
